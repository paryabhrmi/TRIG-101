name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow the GITHUB_TOKEN to publish a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # `enablement` turns Pages on via the API the first time this runs, so
      # the repo does not need the setting flipped by hand beforehand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Not the conventional `github-pages` environment: that one was created
    # when Pages was first enabled from the original MVP branch, and its
    # protection rules only allow that branch — rejecting deploys from main.
    # A fresh environment carries no branch policy, and deploy-pages accepts
    # any environment name.
    environment:
      name: pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The Pages site was first enabled from the original MVP branch, and
      # GitHub only accepts deployments from the branch stored as the site's
      # source. Try repointing the site at this branch; if the token may not
      # update it, recreate the site, which records a fresh source.
      - name: Allow Pages deployments from this branch
        env:
          API: https://api.github.com/repos/${{ github.repository }}/pages
          AUTH: 'Authorization: Bearer ${{ github.token }}'
        run: |
          put=$(curl -s -o put.json -w '%{http_code}' -X PUT -H "$AUTH" \
            -H "Accept: application/vnd.github+json" "$API" \
            -d "{\"build_type\":\"workflow\",\"source\":{\"branch\":\"${GITHUB_REF_NAME}\",\"path\":\"/\"}}")
          echo "PUT $put"; cat put.json || true
          if [ "$put" = "200" ] || [ "$put" = "204" ]; then exit 0; fi

          del=$(curl -s -o del.json -w '%{http_code}' -X DELETE -H "$AUTH" \
            -H "Accept: application/vnd.github+json" "$API")
          echo "DELETE $del"; cat del.json || true

          post=$(curl -s -o post.json -w '%{http_code}' -X POST -H "$AUTH" \
            -H "Accept: application/vnd.github+json" "$API" \
            -d '{"build_type":"workflow"}')
          echo "POST $post"; cat post.json || true
          [ "$post" = "201" ] || [ "$post" = "409" ]

      - id: deployment
        uses: actions/deploy-pages@v4
