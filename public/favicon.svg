  <path d="M14 46 H46 L14 20 Z" fill="none" stroke="#0e7fbd" stroke-width="4" stroke-linejoin="round" />
  <path d="M14 46 H46" stroke="#f5a623" stroke-width="4" stroke-linecap="round" />
